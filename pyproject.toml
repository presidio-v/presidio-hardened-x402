[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presidio-hardened-x402"
version = "0.9.1"
description = "Security middleware for x402 agentic payments — PII redaction, spending policy, and replay detection before blockchain commit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Presidio Security" }]
keywords = [
    "x402", "payments", "security", "pii", "presidio", "blockchain",
    "ai-agents", "micropayments", "hardening", "gdpr",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.27.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Transitive of presidio-analyzer; pin minimum to evict 6 CVEs in 41.x
    # (CVE-2024-0727, CVE-2023-50782, GHSA-h4gh-qq45-vh27, PYSEC-2024-225,
    # CVE-2026-26007, CVE-2026-34073). Audit 2026-04-26.
    "cryptography>=48.0.1",
    # Transitive of httpx; pin minimum to the CVE-2026-45409 fix line (idna < 3.15
    # is vulnerable — the lock shipped 3.11 before the 2026-06-03 cycle). Explicit
    # floor is defense-in-depth so a fresh resolve cannot regress below the fix.
    # Family audit rec R3 (Grok 4.3, 2026-06-06); audit 2026-06-07.
    "idna>=3.15",
    # Transitive of presidio-analyzer (-> requests -> urllib3); pin minimum to
    # evict PYSEC-2026-141 and PYSEC-2026-142 (urllib3 < 2.7.0 vulnerable).
    # Explicit floor is defense-in-depth so a fresh resolve cannot regress below
    # the fix; requests allows urllib3<3,>=1.26 so 2.7.0 resolves cleanly against
    # httpx>=0.27.0. Audit 2026-06-14 (F1).
    "urllib3>=2.7.0",
    # Transitive of Typer-rich CLIs in the audit extra graph; pin minimum to
    # evict PYSEC-2026-2132 (click < 8.3.3 vulnerable). Audit 2026-07-14.
    "click>=8.3.3",
    # Transitive of presidio-analyzer -> spaCy; pin minimum to evict
    # PYSEC-2026-3447 (setuptools < 83.0.0 vulnerable). Audit 2026-07-14.
    "setuptools>=83.0.0",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.7.0",
]
evidence = [
    # Ed25519 signing for the MiCA/EU evidence module (mica.py). Floor matches
    # the _KNOWN_VULNERABLE minimum-safe version in __init__.py.
    "cryptography>=48.0.1",
]
redis = [
    "redis>=5.0.0",
]
audit-s3 = [
    # Enterprise S3AuditWriter (audit_sinks.py). Splunk/Datadog sinks reuse the
    # core httpx dependency; only S3 needs boto3.
    "boto3>=1.34",
]
audit = [
    "pip-audit>=2.7.0",
]
langchain = [
    # >=1.3.3 closes CVE-2026-44843 (GHSA-pjwx-r37v-7724) — unsafe broad-allowlist
    # deserialization in older runtime paths (RunnableWithMessageHistory,
    # astream_log, astream_events(version="v1")). The 0.3.x line gets the same
    # fix at 0.3.85.
    "langchain-core>=1.3.3",
]
crewai = [
    # Intentionally empty: CrewAI 1.14.x currently pulls chromadb==1.1.1, which
    # carries CVE-2026-45829 with no fixed version reported by pip-audit. Keep the
    # adapter importable, but require integrators to install and audit CrewAI in
    # their own environment until that transitive graph is fixed.
]
prometheus = [
    "prometheus-client>=0.20.0",
]
otel = [
    "opentelemetry-api>=1.28.0",
]
schema = [
    "jsonschema>=4.21.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "respx>=0.21.0",
    "fakeredis>=2.23",
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.28.0",
    "jsonschema>=4.21.0",
]

[project.urls]
Homepage = "https://github.com/presidio-v/presidio-hardened-x402"
Repository = "https://github.com/presidio-v/presidio-hardened-x402"
Issues = "https://github.com/presidio-v/presidio-hardened-x402/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_x402"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --tb=short -q"

[tool.coverage.run]
source = ["src/presidio_x402"]

[tool.coverage.report]
fail_under = 90
show_missing = true
