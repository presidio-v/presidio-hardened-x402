name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: read-only token for all jobs (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ fuzz/
      - run: ruff format --check src/ tests/ fuzz/
      - name: Require SPDX + copyright header on every source file
        run: |
          missing=$(grep -rL "SPDX-License-Identifier" src/ fuzz/ --include='*.py' || true)
          if [ -n "$missing" ]; then
            echo "Source files missing an SPDX license header:"
            echo "$missing"
            exit 1
          fi

  fuzz:
    name: Fuzz (Atheris)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Atheris 3.x ships no cp310 wheel; the test matrix is unaffected.
          python-version: "3.12"
      - name: Install package + fuzz extra
        run: pip install -e ".[fuzz]"
      # Dynamic analysis runs with runtime assertions enabled: Python is invoked
      # without -O and PYTHONOPTIMIZE is unset, so `assert` statements in the
      # harnesses and library are checked during fuzzing.
      - name: Run fuzz harnesses (time-boxed)
        run: |
          for f in fuzz/fuzz_*.py; do
            echo "::group::$f"
            python "$f" -atheris_runs=25000 -max_total_time=60
            echo "::endgroup::"
          done

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    # Job-level so the upload step's `if:` can read it — the `secrets` context is
    # not available in a step-level `if`, and a step's own `env:` is not visible
    # to its own condition.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ --cov=presidio_x402 --cov-branch --cov-report=xml --cov-report=json --cov-report=term
      - name: Enforce coverage floors (statement >= 90%, branch >= 80%)
        run: |
          python - <<'PY'
          import json
          import sys

          totals = json.load(open("coverage.json"))["totals"]
          statement = 100 * totals["covered_lines"] / totals["num_statements"]
          branches = totals["num_branches"]
          branch = 100 * totals["covered_branches"] / branches if branches else 100.0
          print(f"statement coverage: {statement:.2f}%  (floor 90%)")
          print(f"branch coverage:    {branch:.2f}%  (floor 80%)")

          failures = []
          if statement < 90:
              failures.append(f"statement {statement:.2f}% < 90%")
          if branch < 80:
              failures.append(f"branch {branch:.2f}% < 80%")
          if failures:
              sys.exit("COVERAGE FAILURE: " + "; ".join(failures))
          PY
      - name: Partner conformance suite (the OEM embed-kit guarantee, SEMVER.md)
        run: python -m presidio_x402.conformance
      # Uploads had been failing on every matrix leg with "Token required - not
      # valid tokenless upload" while the step still reported success, so Codecov
      # received nothing from any interpreter and nothing said so. `token` fixes
      # the upload; `fail_ci_if_error` stops it from rotting silently again. The
      # `if` guard skips the step where no secret is exposed — forks and
      # Dependabot PRs — so those do not fail on a credential they cannot have.
      # Coverage *enforcement* does not depend on this step: the floors above run
      # inline on all four interpreters and fail the job on their own.
      - name: Upload coverage
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          # `file` (singular) is the v4 input name; v5+ ignores it silently, which
          # is why the logged CLI invocation carried no --file at all.
          files: coverage.xml
          flags: py${{ matrix.python-version }}
          name: py${{ matrix.python-version }}
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true

  latency-slo:
    name: Latency SLO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Benchmark regex PII control latency
        run: python -m experiments.run_latency --mode regex --warmup 50 --n 200 --out latency_results_ci.json
      - name: Enforce p99 latency SLO
        run: python -m experiments.check_latency_slo latency_results_ci.json --mode regex --max-p99-ms 50
      - name: Upload latency results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latency-results
          path: latency_results_ci.json

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package + SBOM tool
        run: |
          pip install -e .
          pip install cyclonedx-bom
      - name: Generate SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  lock-drift:
    name: Lockfile drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify uv.lock is up to date with pyproject.toml
        run: uv lock --locked

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run pip-audit over release extras
        run: >
          uv run
          --extra audit
          --extra evidence
          --extra redis
          --extra audit-s3
          --extra langchain
          --extra prometheus
          --extra otel
          --extra schema
          pip-audit --progress-spinner=off --skip-editable
