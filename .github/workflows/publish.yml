name: Publish to PyPI

# Trusted Publisher (OIDC, no stored secrets) + PEP 740 attestations.
# Triggered by a signed v* tag. The publish job runs in the `release`
# environment, which carries a required-reviewer founder gate.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for GitHub artifact attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Generate SBOM
        run: |
          python -m pip install --upgrade cyclonedx-bom
          python -m pip install dist/*.whl
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Stage provenance bundle as a release asset
        # Copy the Sigstore/in-toto attestation bundle to a named file so it can
        # be attached to the GitHub Release. OpenSSF Scorecard's Signed-Releases
        # check inspects release assets and recognises `.intoto.jsonl` provenance.
        run: cp "${{ steps.attest.outputs.bundle-path }}" provenance.intoto.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/
            sbom.cdx.json
            provenance.intoto.jsonl

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing + sigstore
      attestations: write # PEP 740 provenance attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  release-assets:
    name: Attach release assets
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* sbom.cdx.json provenance.intoto.jsonl --repo "$GH_REPO" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* sbom.cdx.json provenance.intoto.jsonl \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "Release $GITHUB_REF_NAME"
          fi
